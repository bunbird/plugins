version: 2
updates:
  # cooldown: a release is not proposed the week it is published. A poisoned
  # release is usually caught within days, and waiting is the cheap
  # supply-chain mitigation.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    cooldown:
      default-days: 7
